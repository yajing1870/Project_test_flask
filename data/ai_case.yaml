- case_id: TC_001
  title: 正常添加图书（必填字段完整）
  precondition: 系统已登录管理员账号，图书列表为空
  steps: 进入图书添加页面 → 输入ISBN：978-7-02-012345-6，书名：《三体》，作者：刘慈欣，出版社：重庆出版社，出版年份：2018 → 点击“保存”
  expected: 图书成功添加，列表中显示该图书，且各字段值与输入一致
- case_id: TC_002
  title: 添加图书时ISBN重复校验
  precondition: 系统中已存在ISBN为978-7-02-012345-6的图书
  steps: 进入图书添加页面 → 输入ISBN：978-7-02-012345-6，书名：《三体Ⅱ》，作者：刘慈欣，其他字段合法 → 点击“保存”
  expected: 提示“ISBN已存在”，图书未被添加，表单保持打开状态
- case_id: TC_003
  title: 编辑图书信息并保存
  precondition: 系统中存在一条ISBN为978-7-02-012345-6的图书记录
  steps: 在图书列表中找到该图书 → 点击“编辑” → 将出版年份由2018修改为2020 → 点击“更新”
  expected: 图书信息更新成功，列表中对应记录的出版年份显示为2020
- case_id: TC_004
  title: 删除单本图书（确认后执行）
  precondition: 系统中存在至少一本图书（ISBN：978-7-02-012345-6）
  steps: 在图书列表中选中该图书 → 点击“删除”按钮 → 在弹出确认框中点击“确定”
  expected: 该图书从列表中消失，数据库中对应记录被逻辑删除（is_deleted = true）或物理删除（依设计而定），无残留数据
- case_id: TC_005
  title: 批量删除图书（含多选与取消操作）
  precondition: 系统中存在至少3本图书，其中2本被勾选
  steps: 勾选第1本和第3本图书 → 点击“批量删除” → 在确认弹窗中点击“取消”
  expected: 所有图书仍完整显示在列表中，未发生任何删除行为
- case_id: TC_006
  title: 按书名模糊搜索功能
  precondition: 系统中存在书名为《三体》《三体Ⅱ》《球状闪电》的图书
  steps: 在搜索框输入“三体” → 点击“搜索”按钮（或回车）
  expected: 列表仅显示《三体》和《三体Ⅱ》两条记录，按相关性或默认排序展示
- case_id: TC_007
  title: 搜索空关键词（不输入直接搜索）
  precondition: 系统中存在多本图书
  steps: 搜索框为空 → 点击“搜索”按钮
  expected: 返回全部图书列表（即重置为默认分页全量展示），无报错或空白页
- case_id: TC_008
  title: 图书列表分页功能验证（第二页跳转）
  precondition: 系统中图书总数≥21本，每页显示10条
  steps: 查看第1页 → 点击页码“2”或“下一页”
  expected: 正确显示第11–20条图书记录，页码高亮显示“2”，URL或状态栏体现page=2
- case_id: TC_009
  title: 添加图书时必填项为空校验（书名为空）
  precondition: 系统已登录管理员账号
  steps: 进入图书添加页面 → 清空书名字段，其余字段填写合法值 → 点击“保存”
  expected: 前端提示“书名不能为空”，保存失败，焦点自动定位至书名输入框
- case_id: TC_010
  title: 非管理员用户尝试添加图书
  precondition: 当前登录用户为普通读者（角色权限为user，非admin）
  steps: 访问图书添加页面（如通过直接URL /books/add）→ 尝试填写并提交表单
  expected: 页面重定向至403禁止访问页或首页，或前端按钮禁用/不可见，后台拒绝创建请求，无图书新增